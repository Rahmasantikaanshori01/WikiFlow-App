name: WikiFlow Deployment Record

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deployment:
    name: Record Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'WikiFlow production deployment',
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://wikiflow-jihara.vercel.app/login',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'WikiFlow production deployment recorded successfully.'
            });